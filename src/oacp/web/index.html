<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>Open Agent Control Panel</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <a class="brand" href="#/agents">
        <img src="/favicon.svg" alt="" width="34" height="34" />
        <span class="brand-text">
          <strong>Agent Control Panel</strong>
          <span class="brand-sub">ADP Core v1</span>
        </span>
      </a>

      <nav class="nav" aria-label="Main">
        <a href="#/agents" data-nav="agents" class="nav-item">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a3 3 0 1 1 0 6 3 3 0 0 1 0-6Zm-7 9a3 3 0 1 1 0 6 3 3 0 0 1 0-6Zm14 0a3 3 0 1 1 0 6 3 3 0 0 1 0-6Zm-7 6a3 3 0 1 1 0 6 3 3 0 0 1 0-6Z" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 9v6M10 17l-3-2m7 2 3-2" stroke="currentColor" stroke-width="1.6" fill="none"/></svg>
          <span>Agents</span>
          <span class="pill" id="nav-agent-count">0</span>
        </a>
        <a href="#/tasks" data-nav="tasks" class="nav-item">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 10h8M8 14h5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <span>Tasks</span>
          <span class="pill" id="nav-task-count">0</span>
        </a>
      </nav>

      <div class="sidebar-foot">
        <div class="muted small" id="endpoint-info">—</div>
        <div class="muted small">Apache-2.0 · <span id="app-version">—</span></div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="titles">
          <h1 id="page-title">Agents</h1>
          <p id="page-subtitle" class="muted">Agents registered through the discover protocol</p>
        </div>
        <div class="toolbar">
          <label class="search" for="search">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="m16 16 4.5 4.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
            <input id="search" type="search" placeholder="Search agents…" autocomplete="off" />
          </label>
          <button id="register-btn" class="btn primary" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            Register agent
          </button>
        </div>
      </header>

      <section id="view" class="view" aria-live="polite"></section>
    </main>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <script type="module" src="/static/app.js"></script>
</body>
</html>
