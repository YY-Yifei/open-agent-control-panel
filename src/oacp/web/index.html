<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>智能体面板</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="app">
    <aside class="side">
      <div class="side-top">
        <a class="brand" href="#/">智能体面板</a>
        <span class="version" id="version"></span>
      </div>

      <div class="side-search">
        <input id="search" type="search" placeholder="搜索智能体" autocomplete="off" data-i18n-ph="search" />
      </div>

      <div class="side-body">
        <div class="group">
          <span data-i18n="agents">智能体</span>
          <span class="count" id="agent-count"></span>
        </div>
        <div id="agent-list" class="list"></div>

        <div class="group" id="session-group" hidden>
          <span data-i18n="sessions">会话</span>
          <button class="link" id="new-session" type="button" data-i18n="session.new">新建</button>
        </div>
        <div id="session-list" class="list"></div>
      </div>

      <div class="side-foot">
        <button class="btn ghost" id="add-agent" type="button" data-i18n="add">添加智能体</button>
        <button class="btn ghost" id="lang" type="button">English</button>
      </div>
    </aside>

    <main class="main">
      <header class="top" id="top"></header>
      <div class="chat" id="chat" aria-live="polite"></div>
      <form class="composer" id="composer" hidden>
        <div class="composer-inner">
          <textarea id="input" rows="1" data-i18n-ph="composer.placeholder" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
          <button class="btn primary" id="send" type="submit" data-i18n="send">发送</button>
        </div>
      </form>
    </main>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <script type="module" src="/static/app.js"></script>
</body>
</html>
