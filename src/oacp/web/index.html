<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>智能体面板</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="app">
    <aside class="side">
      <div class="side-top">
        <a class="brand" href="#/">智能体面板</a>
        <span class="version" id="version"></span>
      </div>

      <div class="side-search">
        <input id="search" type="search" placeholder="搜索智能体" autocomplete="off" data-i18n-ph="search" />
      </div>

      <div class="side-body">
        <div class="group">
          <span data-i18n="agents">智能体</span>
          <span class="count" id="agent-count"></span>
        </div>
        <div id="agent-list" class="list"></div>

        <div class="group" id="session-group" hidden>
          <span data-i18n="sessions">会话</span>
          <button class="link" id="new-session" type="button" data-i18n="session.new">新建</button>
        </div>
        <div id="session-list" class="list"></div>
      </div>

      <div class="side-foot">
        <button class="btn ghost" id="add-agent" type="button" data-i18n="add">添加智能体</button>
        <button class="btn ghost" id="lang" type="button">English</button>
        <!-- 内置助手的入口：只有确认它能连上才出现（连不上 = 没有这个功能），
             所以这里一开始是 hidden，由 agent/panel.js 决定是否揭开。 -->
        <button class="btn ghost" id="agent" type="button" data-i18n="agent.title" hidden>助手</button>
      </div>
    </aside>

    <main class="main">
      <header class="top" id="top"></header>
      <div class="chat" id="chat" aria-live="polite"></div>
      <form class="composer" id="composer" hidden>
        <div class="attach-strip" id="attach-strip" hidden></div>
        <div class="composer-inner">
          <button class="btn ghost attach" id="attach" type="button" data-i18n-title="attach.add" data-i18n-aria="attach.add">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M16.5 6.5 8.9 14a3 3 0 0 0 4.2 4.2l7.4-7.4a5 5 0 0 0-7.1-7.1L5.6 11.5a7 7 0 0 0 9.9 9.9l6.4-6.4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <textarea id="input" rows="1" data-i18n-ph="composer.placeholder" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
          <button class="btn primary" id="send" type="submit" data-i18n="send">发送</button>
        </div>
        <input id="attach-input" type="file" multiple hidden />
      </form>
    </main>
  </div>

  <aside class="agent-drawer" id="agent-drawer" hidden aria-label="内置助手" data-i18n-aria="agent.drawer" role="dialog" aria-modal="false">
    <header class="agent-head">
      <span class="agent-dot" id="agent-dot" data-state="offline"></span>
      <strong><span id="agent-title" data-i18n="agent.title">助手</span><span id="agent-model"></span></strong>
      <span class="agent-hint" id="agent-hint"></span>
      <button class="link" id="agent-stop" type="button" data-i18n="agent.stop" hidden>停止</button>
      <button class="link" id="agent-clear" type="button" data-i18n="agent.clear">清空</button>
      <button class="link" id="agent-close" type="button" aria-label="关闭" data-i18n-aria="agent.close">✕</button>
    </header>
    <div class="agent-log" id="agent-log" aria-live="polite"></div>
    <!-- 输入区复用主对话的 composer 类：同一个边框、同一套自增高高度、同一个发送按钮。
         助手不接收图片，所以这里没有附件按钮 —— 点了没反应的按钮比没有更糟。 -->
    <form class="composer agent-compose" id="agent-form">
      <div class="composer-inner">
        <textarea id="agent-input" rows="1" aria-label="内置助手输入框" data-i18n-aria="agent.input" data-i18n-ph="agent.placeholder" placeholder="问我面板里的事，或让我操作界面"></textarea>
        <button class="btn primary" id="agent-send" type="submit" data-i18n="send">发送</button>
      </div>
    </form>
  </aside>

  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <script type="module" src="/static/app.js"></script>
</body>
</html>
